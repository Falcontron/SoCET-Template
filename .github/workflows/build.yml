name: AFT Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Setup and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            help2man \
            perl \
            python3 \
            python3-pip \
            python3-venv \
            make \
            autoconf \
            g++ \
            flex \
            bison \
            ccache \
            libfl2 \
            libfl-dev \
            zlib1g \
            zlib1g-dev \
            build-essential

      - name: Build and install Verilator from source
        run: |
          git clone https://github.com/verilator/verilator.git
          cd verilator

          # Use the known-good version from your local machine.
          # Your local version reports:
          #   Verilator 5.048 2026-04-26 rev v5.048-56-gc233a3905
          git checkout v5.048

          autoconf
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Check Verilator version
        run: |
          which verilator
          verilator --version

      - name: Set up Python virtual environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run setup
        run: |
          source .venv/bin/activate
          export PYTHONPATH=""
          ./setup.sh

      - name: Run build
        run: |
          source .venv/bin/activate
          export PYTHONPATH=""
          ./build.sh